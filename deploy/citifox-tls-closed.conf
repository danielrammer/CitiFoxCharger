# Password-protected holding site. NO ProxyPass until authenticated tablet validation passes.
<VirtualHost *:443>
    ServerName citifox.ancora.cyou
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/citifox.ancora.cyou/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/citifox.ancora.cyou/privkey.pem
    DocumentRoot /srv/http/citifox-closed
    <Directory /srv/http/citifox-closed>
        AllowOverride None
        Options None
        Require all granted
    </Directory>
    <Location />
        AuthType Basic
        AuthName "CitiFoxCharger"
        AuthBasicProvider file
        AuthUserFile /etc/httpd/citifox/users.htpasswd
        Require user citifox
    </Location>
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^citifox\.ancora\.cyou(?::443)?$ [NC]
    RewriteRule ^ - [R=400,L]
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    CustomLog /var/log/httpd/citifox_access_log "%a %t %m %>s %B"
    ErrorLog /var/log/httpd/citifox_error_log
</VirtualHost>
