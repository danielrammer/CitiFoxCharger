# Included AFTER maya.conf so Maya remains the default virtual host.
<VirtualHost *:80>
    ServerName citifox.ancora.cyou
    DocumentRoot /srv/http/citifox-acme
    Alias /.well-known/acme-challenge/ /srv/http/citifox-acme/.well-known/acme-challenge/
    <Directory /srv/http/citifox-acme>
        AllowOverride None
        Options None
        Require all denied
    </Directory>
    <Directory /srv/http/citifox-acme/.well-known/acme-challenge>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^citifox\.ancora\.cyou(?::80)?$ [NC]
    RewriteRule ^ - [R=400,L]
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$
    RewriteRule ^ https://citifox.ancora.cyou/ [R=302,L]
    CustomLog /var/log/httpd/citifox_access_log "%a %t %m %>s %B"
    ErrorLog /var/log/httpd/citifox_error_log
</VirtualHost>
